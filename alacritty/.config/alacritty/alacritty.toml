[general]
import = ["themes/luna.toml"]

[font]
size = 12.0

[font.normal]
family = "GeistMono Nerd Font Mono"

[[keyboard.bindings]]
key = "ArrowUp"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "ArrowDown"
mods = "Command"
action = "DecreaseFontSize"

[window]
opacity = 1.0
blur = false
