onboarding = false
[keys]
prefix = "ctrl+a"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

split_horizontal = "prefix+s"
split_vertical = "prefix+v"

previous_tab = "prefix+p"
next_tab = "prefix+n"

previous_workspace = "prefix+ctrl+s"
next_workspace = "prefix+ctrl+d"
workspace_picker = "prefix+w"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
open_notification_target = ""

reload_config = "prefix+r"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.local/scripts/herdr-s"
width = "80%"
height = "80%"

[theme]
name = "terminal"

# Match luna theme (nvim)
[theme.custom]
panel_bg = "#060606"
sidebar_bg = "#060606"
active_row_bg = "#1c1c1c"
selection_bg = "#333333"
accent = "#75a1c7"
surface0 = "#333333"
surface1 = "#404040"
surface_dim = "#1c1c1c"
overlay0 = "#888888"
overlay1 = "#b8b8b8"
text = "#e4e4e8"
subtext0 = "#a8a8a8"
mauve = "#c4a8d6"
green = "#6fbe80"
yellow = "#d9a35a"
red = "#e08585"
blue = "#8c9cb8"
teal = "#75a1c7"
peach = "#e19067"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false

[experimental]
kitty_graphics = true

