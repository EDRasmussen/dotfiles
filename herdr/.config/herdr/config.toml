onboarding = false
[keys]
prefix = "ctrl+a"
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

split_horizontal = "prefix+s"
split_vertical = "prefix+v"

previous_tab = "prefix+p"
next_tab = "prefix+n"

previous_workspace = "prefix+ctrl+s"
next_workspace = "prefix+ctrl+d"
workspace_picker = "prefix+w"
navigate_workspace_up = "k"
navigate_workspace_down = "j"
open_notification_target = ""

reload_config = "prefix+r"

[[keys.command]]
key = "prefix+f"
type = "popup"
command = "~/.local/scripts/herdr-s"
width = "80%"
height = "80%"

[theme]
# Custom Visual Studio 2012–2015-inspired Dark palette.
name = "catppuccin"

[theme.custom]
panel_bg = "#1e1e1e"
sidebar_bg = "#252526"
active_row_bg = "#373737"
selection_bg = "#264f78"
surface0 = "#2d2d30"
surface1 = "#3f3f46"
surface_dim = "#252526"
overlay0 = "#636369"
overlay1 = "#808080"
text = "#dcdcdc"
subtext0 = "#bbbbbb"
accent = "#007acc"
mauve = "#c586c0"
green = "#608b4e"
yellow = "#dcdcaa"
red = "#f44747"
blue = "#569cd6"
teal = "#4ec9b0"
peach = "#ce9178"

[ui]
agent_panel_sort = "spaces"
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = true
pane_scrollbars = false
sidebar_collapsed_mode = "hidden"

[experimental]
kitty_graphics = true

